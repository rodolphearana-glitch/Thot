# Configuration de Thot — EXEMPLE
#
# Copie ce fichier en `thot.config.toml` (même dossier). `lancer.bat` le fait tout seul.
# `thot.config.toml` est ignoré par Git : rien de ce que tu y mets ne part sur GitHub.
#
# Par défaut, Thot fait comme le Studio TLS : il utilise Claude Code et Codex installés
# sur ton PC, connectés à tes comptes Claude et ChatGPT. AUCUNE clé d'API n'est nécessaire.

# ---------------------------------------------------------------------------
# Participants : qui peut parler dans une session.
# provider :
#   "claude"    Claude Code du PC, compte Claude (abonnement)        — sans clé
#   "codex"     Codex du PC, compte ChatGPT (abonnement)             — sans clé
#   "lmstudio"  modèle local chargé dans LM Studio (serveur local)   — sans clé
#   "ollama"    modèle local servi par Ollama                        — sans clé
#   "manuel"    relais : Thot te donne le message, tu colles la réponse
#   "anthropic" / "openai"  API payantes, seulement si tu le veux un jour (clés plus bas)
# modele : vide = le modèle par défaut du compte.
# ---------------------------------------------------------------------------

[[participants]]
nom = "Claude"
provider = "claude"
modele = ""

[[participants]]
nom = "GPT"
provider = "codex"
modele = ""

[[participants]]
nom = "Local"
provider = "lmstudio"
modele = "qwen/qwen3.5-9b"   # l'identifiant affiché sous le nom du modèle dans LM Studio
url = "http://localhost:1234"

# [[participants]]
# nom = "GPT (relais)"
# provider = "manuel"

# ---------------------------------------------------------------------------
# Plafonds quotidiens. Une session se met en pause quand un plafond est atteint.
# Les appels à Claude Code et Codex comptent dans appels_par_jour (pour éviter
# qu'une boucle n'épuise tes abonnements) ; les tokens ne concernent que les API.
# ---------------------------------------------------------------------------

[budget]
appels_par_jour = 200
anthropic_tokens_par_jour = 0
openai_tokens_par_jour = 0

# ---------------------------------------------------------------------------
# Auto-mise à jour : Claude et GPT peuvent proposer des modifications du labo.
# Elles sont testées puis fusionnées sans te demander, SI elles ne touchent
# que les chemins autorisés ci-dessous. Tout le reste attend ton accord.
# ---------------------------------------------------------------------------

[auto_maj]
active = true
chemins_autorises = [
    "thot/roles/**",
    "thot/web/static/**",
    "prompts/**",
    "experiences/**",
    "tests/**",
]
duree_max_tests_s = 300

# ---------------------------------------------------------------------------
# Expériences locales que les IA peuvent lancer elles-mêmes.
# ---------------------------------------------------------------------------

[experiences]
autoriser_lancement_auto = true
duree_max_s = 1800

# ---------------------------------------------------------------------------
# Mode codage (bloc thot-codage) : l'IA code dans une copie à part du dépôt,
# l'autre relit, puis les garde-fous de l'auto-mise à jour s'appliquent.
# ---------------------------------------------------------------------------

[codage]
active = true
duree_max_s = 3600        # au-delà, Claude Code / Codex et tout ce qu'ils ont lancé sont arrêtés
duree_max_tests_s = 600

# ---------------------------------------------------------------------------
# Observer Thot : des IA analysent des sessions passées (menu « Observer Thot »),
# ou une session demande elle-même à être observée (bloc thot-observer) et reçoit
# le rapport dans son fil.
# ---------------------------------------------------------------------------

[observation]
analystes = []            # vide = les participants de la session qui demande ; sinon par ex. ["GPT", "Claude"]
tours = 2                 # tours d'IA d'une observation demandée depuis une session
max_par_session = 3       # au-delà, une session ne peut plus demander d'observation
max_caracteres_rapport = 20000

# ---------------------------------------------------------------------------
# Mise à jour depuis GitHub (comme le Studio TLS) : au démarrage puis toutes les
# N minutes, Thot récupère les nouveautés de GitHub, teste le nouveau code avant
# de l'installer, envoie sur GitHub le journal du labo, et redémarre seul si le
# code a changé. Le dépôt est public : les sessions du journal le sont aussi.
# ---------------------------------------------------------------------------

[github]
active = true
intervalle_minutes = 10
pousser = true
branche = "main"

[contexte]
# Taille maximale (en caractères) du contexte envoyé à chaque tour.
max_caracteres = 120000

# ---------------------------------------------------------------------------
# Clés d'API : seulement pour les providers "anthropic" et "openai". Inutiles sinon.
# ---------------------------------------------------------------------------

[cles]
anthropic = ""
openai = ""
